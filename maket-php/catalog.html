<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./assets/css/style.css">
  <title>Srez Laravel shop</title>
</head>

<body>
  <header>
    <div class="header__content container">
      <h1>Logo</h1>
      <ul class="header__links">
        <li><a href="">Catalog</a></li>
        <li><a href="">FAQ</a></li>
        <li><a href="">About us</a></li>
      </ul>
      <ul class="header__btns">
        <li>
          <form class="button_form" action="" method="post">
            <button class="btn">
              Log out
            </button>
          </form>
        </li>
        <li><a class="btn" href="">Login</a></li>
        <li><a class="btn" href="">Register</a></li>
      </ul>
    </div>
  </header>
  <section class="catalog container">
    <div class="catalog__headline">
      <h2>Catalog</h2>
      <a class="btn" href="">Add product</a>
    </div>
    <div class="catalog__wrapper">
      <article class="product">
        <img src="./assets/img/test.webp" alt="product" class="product__image">
        <p class="product__name">
          T-Shirt
        </p>
        <p class="product__price">100 $</p>
        <button class="product__btn">
          Buy
        </button>
      </article>
    </div>
  </section>

  <footer>
    <div class="header__content container">
      <h1>Logo</h1>
      <ul class="header__links">
        <li><a href="">Catalog</a></li>
        <li><a href="">FAQ</a></li>
        <li><a href="">About us</a></li>
      </ul>
      <ul class="header__btns">
        <li>
          <form class="button_form" action="" method="post">
            <button class="btn">
              Log out
            </button>
          </form>
        </li>
        <li><a class="btn" href="">Login</a></li>
        <li><a class="btn" href="">Register</a></li>
      </ul>
    </div>
  </footer>
</body>

</html>
