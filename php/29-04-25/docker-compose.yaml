services:
  php:
    build:
      context: dockerfiles
      dockerfile: php.dockerfile
    volumes:
      - ./src:/var/www/php_server
    ports:
      - "8000:80"
    working_dir: /var/www/php_server
    depends_on:
      - mysql
  nginx:
    image: "nginx:stable-alpine"
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src:/var/www/php_server
    depends_on:
      - php
  mysql:
    image: "mysql:8.0"
    ports:
      - "3316:3306"
    env_file:
      - env/mysql.env
    volumes:
      - ./env/init.sql:/docker-entrypoint-initdb.d/init.sql
  migrate:
    build:
      context: dockerfiles
      dockerfile: php.dockerfile
    volumes:
      - ./src:/var/www/php_server
    working_dir: /var/www/php_server
    depends_on:
      - mysql
    command: php /var/www/php_server/migrations.php
