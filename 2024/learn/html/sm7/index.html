<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alphabank</title>

    <link rel="shortcut icon" href="icon.png" />
  </head>
  <body>
    <form method="post" name="signup">
      <div class="main">
        <h1>Заявка на получение кредита в Alphabank</h1>
        <div style="display: flex; align-items: center">
          <p>Имя:</p>
          <input
            type="text"
            name="name"
            id="1"
            style="height: 20px; margin-right: 5px"
          />
          <p>Фамилия:</p>
          <input
            type="text"
            name="name"
            id="1"
            style="height: 20px; margin-right: 5px"
          />
          <p>Возраст:</p>
          <input
            type="number"
            name="name"
            id="1"
            style="height: 20px; margin-right: 5px"
          />
        </div>
        <div style="display: flex; align-items: center">
          <p>Адрес:</p>
          <textarea
            name="1"
            id="1"
            cols="30"
            rows="10"
            style="width: 400px; height: 100px"
          ></textarea>
        </div>
        <div style="display: flex; align-items: center">
          <p>Выбрать количество мышеловок:</p>
          <select name="jvnk" id="fevjk">
            <option value="text">Выбор</option>
            <option value="text">1-10</option>
            <option value="text">10-100</option>
            <option value="text">100-10000000000000</option>
            <option value="text">10000000000000-(-100)</option>
          </select>
        </div>

        <div
          style="
            margin: 1%;
            margin-bottom: 3%;
            display: flex;
            width: 20%;
            flex-wrap: wrap;
          "
        >
          <div>
            <input type="radio" title="" name="money" /> $1000 под 88,0% годовых
          </div>
          <div>
            <input type="radio" title="" name="money" /> $5000 под 68,0% годовых
          </div>
          <div>
            <input type="radio" title="" name="money" /> $10000 под 48,0%
            годовых
          </div>
        </div>

        <div style="display: flex; align-items: center">
          <button style="margin-right: 10px">Подать заявку</button>
          <button>Очистить</button>
        </div>
      </div>
    </form>
  </body>
</html>
