<!DOCTYPE html>
<html>
  <head>
    <title>Выпадающее меню</title>
    <style>
      /* CSS для стилизации меню и анимации */
      .dropdown {
        position: relative;
        display: inline-block;
      }

      .dropdown-button {
        background-color: #4caf50;
        color: white;
        padding: 16px;
        font-size: 16px;
        border: none;
        cursor: pointer;
        transition: background-color 0.3s ease; /* Плавное изменение цвета при наведении */
      }

      .dropdown-button:hover {
        background-color: #3e8e41;
      }

      .dropdown-content {
        display: none;
        position: absolute;
        background-color: #f9f9f9;
        min-width: 160px;
        box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
        z-index: 1;
        opacity: 0; /* Изначально делаем невидимым */
        transform: translateY(-10px); /* Сдвигаем немного вверх */
        transition: opacity 0.3s ease, transform 0.3s ease; /* Плавное появление и смещение */
        top: 100%; /* Позиционируем сразу под кнопкой */
        left: 0;
      }

      .dropdown-content a {
        color: black;
        padding: 12px 16px;
        text-decoration: none;
        display: block;
        transition: background-color 0.3s ease; /* Плавное изменение цвета ссылок при наведении */
      }

      .dropdown-content a:hover {
        background-color: #ddd;
      }

      .show {
        display: block;
        opacity: 1; /* Показываем */
        transform: translateY(0); /* Возвращаем на место */
      }
    </style>
  </head>
  <body>
    <h2>Выпадающее меню с анимацией</h2>

    <div class="dropdown">
      <button onclick="toggleDropdown()" class="dropdown-button">Меню</button>
      <div id="myDropdown" class="dropdown-content">
        <a href="#">Ссылка 1</a>
        <a href="#">Ссылка 2</a>
        <a href="#">Ссылка 3</a>
      </div>
    </div>

    <script>
      /* JavaScript для управления отображением выпадающего меню */
      function toggleDropdown() {
        document.getElementById("myDropdown").classList.toggle("show");
      }

      // Закрыть выпадающее меню, если пользователь щелкает за его пределами
      window.onclick = function (event) {
        if (!event.target.matches(".dropdown-button")) {
          var dropdowns = document.getElementsByClassName("dropdown-content");
          for (var i = 0; i < dropdowns.length; i++) {
            var openDropdown = dropdowns[i];
            if (openDropdown.classList.contains("show")) {
              openDropdown.classList.remove("show");
            }
          }
        }
      };
    </script>
  </body>
</html>
